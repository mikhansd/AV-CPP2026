# Nav2 params (ROS 2 Humble) adjusted for an Ackermann vehicle behind the
# twist_to_internal_drive bridge.
#
# Vehicle numbers these values are derived from:
#   wheelbase        = 0.8128 m
#   bridge max steer = 0.25 rad  ->  min turning radius = 0.8128 / tan(0.25) = 3.18 m
#   bridge max speed = 0.20 m/s
# If you change max_steer_rad or max_speed_mps in the bridge, change the
# matching values below. Everything marked TUNE is a starting point.
#
# LOCALIZATION: use EITHER slam_toolbox OR map_server + amcl, never both
# (both publish map -> odom). If you use slam_toolbox, ignore the amcl /
# map_server blocks and remove lifecycle_manager_localization from your launch.

amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    laser_model_type: likelihood_field
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.10
    update_min_d: 0.10
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "./AV-CPP2026/maps/meadow_map1.yaml"   # must point at your saved map when using map_server

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.50
      allow_unknown: true
      downsample_costmap: false
      downsampling_factor: 1
      max_planning_time: 5.0              # larger radius = longer searches
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      terminal_checking_interval: 5000
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 15.0 # scale with the radius (was 3.0)
      minimum_turning_radius: 3.3         # MUST be >= 3.18 (was 0.90)
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0            # matches MPPI model_dt below
    odom_topic: /odom                     # MPPI reads current velocity from here
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.30

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.40
      yaw_goal_tolerance: 3.14            # car cannot rotate in place; ignore heading
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # Horizon: 7.0 s * 0.2 m/s = 1.4 m lookahead. TUNE (CPU permitting).
      time_steps: 70
      model_dt: 0.1                       # = 1 / controller_frequency
      batch_size: 1000
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      visualize: false
      reset_period: 1.0
      prune_distance: 2.5
      transform_tolerance: 0.20
      motion_model: "Ackermann"

      # Limits must not exceed what the bridge will actually send.
      vx_max: 0.20
      vx_min: 0.0                         # no reverse from MPPI
      vy_max: 0.0
      wz_max: 0.10                        # ~ vx_max / min_turning_r = 0.06
      ax_max: 0.5
      ax_min: -0.5
      ay_max: 0.0
      AckermannConstraints:
        min_turning_r: 3.3                # MUST be >= 3.18 (was 0.90)

      vx_std: 0.05
      vy_std: 0.0
      wz_std: 0.05
      regenerate_noises: true
      enforce_path_inversion: false
      inversion_xy_tolerance: 0.2
      # If /odom has no valid twist (twist.linear.x stays 0 while driving),
      # MPPI thinks the car is stopped every cycle. Either fix odom twist or
      # set open_loop: true as a workaround.
      open_loop: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_collision_cost: 253.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: false                    # would try to rotate in place near the goal
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.05
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
        offset_from_furthest: 5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # The default trees' recovery steps include Spin (rotate in place), which an
    # Ackermann car cannot do, and BackUp at 0.025 m/s. Copy these trees and
    # remove <Spin/>, then point these two paths at your copies.
    default_nav_to_pose_bt_xml: "/home/avcpp/AV-CPP2026/Vehicle/src/vehicle_core/behavior_trees/navigate_to_pose_ackermann.xml"
    default_nav_through_poses_bt_xml: "/home/avcpp/AV-CPP2026/Vehicle/src/vehicle_core/behavior_trees/navigate_through_poses_ackermann.xml"

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]  # "spin" removed (no in-place rotation)

    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

# velocity_smoother is intentionally NOT used for first bring-up. It scales
# linear and angular velocity independently, which distorts the w/v ratio the
# bridge turns into a steering angle. Controller output on /cmd_vel goes
# straight to the bridge, which has its own timeout and limits.
# If you add it back later: controller_server cmd_vel -> cmd_vel_nav,
# smoother input cmd_vel_nav, smoother output -> the topic the bridge reads,
# with max_velocity [0.20, 0.0, 0.10] and min_velocity [-0.20, 0.0, -0.10].

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      # TUNE: replace with a measured footprint polygon, e.g.
      # footprint: "[[x1, y1], [x2, y2], ...]"  (a 0.35 m circle is smaller
      # than a vehicle with a 0.81 m wheelbase)
      robot_radius: 0.35
      transform_tolerance: 0.50
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      robot_radius: 0.35                  # TUNE: see local_costmap note
      transform_tolerance: 0.50
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 8.0
          raytrace_max_range: 10.0
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: true

# Only needed with map_server + amcl (not with slam_toolbox).
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["map_server", "amcl"]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower